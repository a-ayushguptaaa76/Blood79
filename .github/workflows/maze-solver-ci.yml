name: Maze Solver CI

on:
  push:
    branches: [main]
    paths:
      - "projects/Azisly-Round2-Maze-Solver/**"
      - ".github/workflows/maze-solver-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "projects/Azisly-Round2-Maze-Solver/**"
      - ".github/workflows/maze-solver-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile
        run: python -m compileall -q projects/Azisly-Round2-Maze-Solver

      - name: Run smoke tests
        run: python -m unittest discover -s projects/Azisly-Round2-Maze-Solver/tests -v
